[project]
name = "philotes-sim"
version = "0.1.0"
description = "Phase 0 matcher simulator for Philotes (docs/spec.md §12): synthetic populations, matcher v0, metrics."
license = "AGPL-3.0-only"
requires-python = ">=3.13,<3.14"
dependencies = [
    "numpy>=2.5.3",
    "ortools>=9.15.6755",
]

[project.scripts]
philotes-sim = "philotes_sim.cli:main"

[build-system]
requires = ["uv_build>=0.11.14,<0.12.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]  # the spec's typography (§, –, ·) appears in docstrings

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]
