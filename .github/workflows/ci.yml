name: CI

# Git Flow: feature branches integrate into develop, releases go develop → main.
on:
  push:
    branches: [develop, main, master, "feature/**", "feat/**", "fix/**", "release/**", "hotfix/**"]
  pull_request:
    branches: [develop, main, master]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0  # no moving major tag is published
        with:
          enable-cache: true
      # Python comes from .python-version (3.13); --locked fails if uv.lock is stale.
      - name: Install
        run: uv sync --locked
      - name: Lint
        run: uv run ruff check .
      - name: Format check
        run: uv run ruff format --check .
      - name: Tests
        run: uv run pytest
